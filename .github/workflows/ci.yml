name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaming_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Dummy values are enough for tests: settings.py requires these to be
      # set, but nothing in the test suite exercises the real integrations
      # (Cloudinary/Chroma calls are mocked or never invoked at import time,
      # unlike the sentence-transformers models below). GROQ_API_KEY is the
      # one exception — rag_chat/services/groq_service.py constructs a Groq
      # client at *module import* time, so it must be set (even to a dummy
      # value) just for `python manage.py test` to be able to import the app
      # at all, whether or not any test actually calls Groq.
      SECRET_KEY: ci-test-secret-key
      JWT_SECRET_KEY: ci-test-jwt-secret-key
      GROQ_API_KEY: ci-test-groq-key
      DEBUG: "False"
      ENVIRONMENT: development
      DATABASE_URL_DEV: postgres://postgres:postgres@localhost:5432/gaming_platform_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      # settings.py defaults these three to `not DEBUG`, i.e. True whenever
      # DEBUG=False. Left unset here, SECURE_SSL_REDIRECT alone made
      # SecurityMiddleware 301-redirect every plain-HTTP request the Django
      # test client makes (it doesn't follow redirects by default), which
      # surfaced as ~150 unrelated-looking test failures/errors instead of
      # one obvious cause.
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-MiniLM-L6-v2-ms-marco-MiniLM-L-6-v2-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test

  frontend-ci:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  container-scan:
    name: Dependency & container vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Filesystem mode: scans backend/requirements.txt and
      # frontend/package-lock.json for known-vulnerable dependency versions,
      # plus both Dockerfiles for misconfigurations (e.g. running as root —
      # neither does; backend/Dockerfile explicitly drops to a non-root
      # `appuser`). Complements Dependabot (.github/dependabot.yml), which
      # opens PRs weekly, with a scan on every push/PR — Dependabot can miss a
      # vulnerability disclosed *after* its weekly run but *before* the next
      # one, since it only checks on its own schedule.
      # exit-code 0 (report-only) deliberately, not 1: a stack this size
      # (torch, transformers, chromadb, ...) will very likely surface
      # existing CRITICAL/HIGH findings the first time this runs, and this
      # should not silently start blocking every PR's merge the moment it's
      # added. Triage the first report, then flip to exit-code: 1 once the
      # backlog is either fixed or consciously accepted — see
      # docs/SECURITY_CHECKLIST.md's Dependency scanning section.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH
          exit-code: 0
