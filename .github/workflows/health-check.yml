name: Backend Health Check

# Keep-alive / uptime ping — separate from ci.yml and deploy.yml on purpose,
# so a health-check failure never blocks a PR or a deploy, and neither of
# those workflows changing affects this one.
#
# Requires a repository variable named PRODUCTION_BACKEND_URL, set to the
# backend's base URL with no trailing slash (e.g.
# https://esports-pakistan-backend.onrender.com) — see
# Settings -> Secrets and variables -> Actions -> Variables. Not a repo
# *secret*, since it's just the public base URL the frontend already calls.

on:
  # Asked for every 5 minutes so this ping stays ahead of Render's ~15-minute
  # free-tier idle-sleep threshold. In practice GitHub does NOT honor this
  # reliably: `schedule` triggers are documented as best-effort, and observed
  # real gaps between runs of this workflow are routinely 20-30 minutes, not
  # 5 — confirmed by comparing consecutive run timestamps in the Actions tab.
  # That's a GitHub Actions scheduler limitation, not something fixable from
  # this file: a tighter cron string doesn't force tighter actual cadence.
  # Net effect: the backend WILL periodically get a real chance to fully
  # spin down no matter what's written here, so "Call health endpoint"
  # below is budgeted to comfortably outlast a cold start when that happens,
  # rather than trying to prevent the spin-down from ever occurring at all.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /api/core/health/
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check PRODUCTION_BACKEND_URL is configured
        run: |
          if [ -z "${{ vars.PRODUCTION_BACKEND_URL }}" ]; then
            echo "::error::Repository variable PRODUCTION_BACKEND_URL is not set — see Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # A single isolated failure here is expected background noise from
      # Render free-tier spin-down + GitHub's scheduler jitter (see the
      # `schedule:` comment above) — it does not by itself mean the backend
      # is broken. Only treat this as a real incident if several *consecutive*
      # scheduled runs fail in a row (check the Actions tab's run history),
      # which would point at an actual crash/outage instead of a cold start.
      #
      # --max-time is per-attempt, not the overall budget. Widened from an
      # earlier 130s total budget after that one still lost to a real cold
      # start (Render logs: gunicorn ready ~50s after the waking request
      # landed, but total request latency — including Render's own wake-up
      # overhead before the app even starts — still slightly exceeded it).
      # This budget has real headroom above every cold start observed so far.
      - name: Call health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 40 \
            --retry 5 --retry-delay 10 --retry-max-time 300 \
            "${{ vars.PRODUCTION_BACKEND_URL }}/api/core/health/"
