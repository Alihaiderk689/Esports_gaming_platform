name: Backend Health Check

# Keep-alive / uptime ping — separate from ci.yml and deploy.yml on purpose,
# so a health-check failure never blocks a PR or a deploy, and neither of
# those workflows changing affects this one.
#
# Requires a repository variable named PRODUCTION_BACKEND_URL, set to the
# backend's base URL with no trailing slash (e.g.
# https://esports-pakistan-backend.onrender.com) — see
# Settings -> Secrets and variables -> Actions -> Variables. Not a repo
# *secret*, since it's just the public base URL the frontend already calls.

on:
  # Every 5, not 10: Render's free tier spins an instance down after ~15
  # minutes with no incoming traffic, and this ping is the only thing
  # standing between it and that sleep. A 10-minute cadence leaves almost
  # no margin for a GitHub Actions scheduled run landing late (GitHub does
  # not guarantee schedule punctuality — see the note in the "Call health
  # endpoint" step below for a real instance of this), so a single delayed
  # run could let the 15-minute window lapse. 5 minutes leaves enough slack
  # that one late run alone can't cause a spin-down.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /api/core/health/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PRODUCTION_BACKEND_URL is configured
        run: |
          if [ -z "${{ vars.PRODUCTION_BACKEND_URL }}" ]; then
            echo "::error::Repository variable PRODUCTION_BACKEND_URL is not set — see Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # --max-time is per-attempt, not the overall budget: Render's free
      # tier cold-starts a spun-down instance in 30-60+s (see
      # docs/OPERATIONS.md, "Health checks"). At the old --max-time 10 an
      # in-progress cold start got cut off before it could ever answer, so
      # every retry restarted the wait from zero instead of just outlasting
      # it — the ping (whose whole job is to prevent that sleep) failed
      # precisely when the instance most needed waking. Confirmed against a
      # real cold start (Render logs: instance woke and finished booting
      # gunicorn ~50s after the request that woke it landed) that still ran
      # long enough to just barely exceed a 130s total retry budget, so this
      # is widened further with real margin above that observed worst case.
      - name: Call health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 4 --retry-delay 10 --retry-max-time 240 \
            "${{ vars.PRODUCTION_BACKEND_URL }}/api/core/health/"
